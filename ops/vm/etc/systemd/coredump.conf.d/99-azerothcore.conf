[Coredump]
# pb-worldserver runs at ~4G RSS and, until the shutdown double-free is fixed,
# dumps core on EVERY stop (see docs/findings/illidan-crash-4-*.md). Each dump
# is ~620M compressed. Left at systemd's defaults that store is allowed to grow
# to 10% of the root filesystem before anything prunes it.
#
# Cap it explicitly so a burst of crashes can never crowd out the DB or the
# build trees.
Compress=yes

# Hard ceiling on /var/lib/systemd/coredump. Oldest dumps are pruned first.
# ~3G keeps roughly the 4-5 most recent worldserver dumps, which is more than
# enough history to diagnose a repeating crash.
MaxUse=3G

# Never let dump storage take the root filesystem below this much free space,
# regardless of MaxUse.
KeepFree=10G

# Refuse to write a dump for a process larger than this rather than stalling
# the box writing a huge one. Comfortably above worldserver's ~4G RSS.
ProcessSizeMax=8G
ExternalSizeMax=8G
