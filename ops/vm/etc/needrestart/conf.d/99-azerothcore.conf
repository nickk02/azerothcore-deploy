# Keep needrestart from auto-restarting the AzerothCore services after library
# upgrades (in practice: the nightly unattended-upgrades pass over
# libssl3t64/libcrypto3, fired by apt-daily-upgrade.timer around 06:07 UTC).
#
# Why: the worldserver aborts with "double free or corruption (!prev)" while
# tearing down its DatabaseWorkerPool if it is stopped at a moment when
# libssl.so.3 / libcrypto.so.3 have already been unlinked and replaced on disk.
# Acore::AbortHandler turns that SIGABRT into a SIGSEGV to force a coredump, so
# every needrestart-driven restart looks like a realm crash. See
# docs/findings/illidan-crash-4-needrestart-openssl-teardown.md in
# nickk02/azerothcore-deploy.
#
# Trade-off, deliberate: after an OpenSSL security update these processes keep
# the old (already-unlinked) library mapped until somebody restarts them on
# purpose. Do that by hand during a verified 0-players window rather than
# letting the upgrade do it. This is a LAN-only realm, so carrying an unpatched
# libssl for a few hours is the cheaper risk.
#
# This merges into the hash defined in /etc/needrestart/needrestart.conf; it
# does not replace it.

$nrconf{override_rc}->{qr(^pb-worldserver\.service$)} = 0;
$nrconf{override_rc}->{qr(^pb-authserver\.service$)}  = 0;
$nrconf{override_rc}->{qr(^ac-worldserver\.service$)} = 0;
$nrconf{override_rc}->{qr(^ac-authserver\.service$)}  = 0;

1;
