#  Local override of /usr/lib/tmpfiles.d/tmp.conf.
#  See tmpfiles.d(5) for details.
#
#  /tmp on this host is a tmpfs, i.e. RAM-backed. Filling it does not just waste
#  disk, it competes directly with the memory pb-worldserver and MySQL want.
#  Upstream ships a 10-day age-out, which is no protection at all against a
#  multi-gigabyte write that happens in a single afternoon (an extracted
#  coredump filled all 7.6G of it on 2026-07-31).
#
#  Age-out shortened to 2 days. The real protection is:
#    - /var/tmp/ac-scratch for anything large (on disk, see 99-ac-scratch.conf)
#    - the ac-diskguard.timer threshold check
#  This just narrows the window.

# Clear tmp directories separately, to make them easier to override
q /tmp 1777 root root 2d
q /var/tmp 1777 root root 30d
