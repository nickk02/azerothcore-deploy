# On-disk scratch space for large, disposable working files: extracted
# coredumps, decompressed DB dumps, patch trees, anything multi-gigabyte.
#
# Use this INSTEAD OF /tmp. /tmp here is a tmpfs and lives in RAM; putting a
# 3.7G extracted core there starves the worldserver. /var/tmp/ac-scratch is on
# the root filesystem (23G+ free) and ages out on its own.
#
# Contents older than 3 days are removed by systemd-tmpfiles-clean.timer.
d /var/tmp/ac-scratch 1777 root root 3d
